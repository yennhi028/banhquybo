<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bơ's Little Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CẤU HÌNH GIAO DIỆN (CSS) ================= */
        :root {
            --color-title: #806044; /* Màu chữ BÁNH QUY BƠ */
            --color-sub: #B89476; /* Màu chữ Welcome to... */
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            /* Gắn hình nền GIF bạn gửi */
            background-image: url('https://i.pinimg.com/originals/7e/94/db/7e94db5560ea776c9c34e6e295412c58.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Nút phát nhạc */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        #music-btn:hover {
            transform: scale(1.05);
        }

        /* Khung quản lý trang */
        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Căn giữa hoàn hảo theo chiều dọc */
            position: relative;
        }
        .page.active { display: flex; }

        /* Hiệu ứng khung kính trong suốt (Glassmorphism) giúp nội dung nổi bật */
        .container {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65); /* Nền trắng trong suốt */
            backdrop-filter: blur(8px); /* Làm mờ ảnh nền phía sau */
            -webkit-backdrop-filter: blur(8px);
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
            
            /* Nhích toàn bộ khung lên trên 1 chút theo yêu cầu */
            transform: translateY(-8%); 
        }

        /* Riêng khung ở trang 2 thì không nhích lên để chừa chỗ cho nút "Trở lại" */
        .page2-container {
            transform: translateY(0);
            margin-top: 40px; 
        }

        /* Chữ (Typography) */
        .title {
            color: var(--color-title);
            font-size: min(9vw, 3rem); 
            margin: 10px 0;
            white-space: nowrap; 
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8); /* Viền sáng giúp chữ nét hơn */
        }

        .subtitle {
            color: var(--color-sub);
            font-size: min(4.5vw, 1.5rem); 
            margin-bottom: 35px;
            white-space: nowrap; 
        }

        .small-text {
            color: var(--color-title);
            font-style: italic;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* Nút bấm chính */
        .btn-main {
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(128, 96, 68, 0.4);
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            background-color: #6a4f38;
        }

        .btn-main.small {
            padding: 10px 20px;
            font-size: 1rem;
        }

        /* Nút Mạng Xã Hội */
        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            padding: 10px 22px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        .social-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .facebook { background-color: #1877F2; }
        .discord { background-color: #5865F2; }
        .ngl { background-color: #FF4F79; }

        /* TRANG 2: TÌM KIẾM & DANH SÁCH */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid var(--color-title);
            color: var(--color-title);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            z-index: 100;
        }
        .back-btn:hover { background: var(--color-title); color: white; }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--color-sub);
            outline: none;
            font-size: 1rem;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--color-title);
            font-weight: bold;
        }
        .search-box input::placeholder { color: var(--color-sub); font-weight: normal; }

        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: var(--color-title);
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px dashed var(--color-sub);
            transition: 0.3s;
        }

        .char-card:hover {
            transform: scale(1.05);
            background: #fdf5ef;
            border-color: var(--color-title);
        }

        /* MODAL (Khung thông tin chi tiết) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid var(--color-title);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--color-sub);
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--color-title); transform: scale(1.2); }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tag {
            background: var(--color-sub);
            color: var(--white);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .info-section {
            text-align: left;
            margin-bottom: 20px;
            background: #fdf5ef;
            padding: 15px;
            border-radius: 10px;
            color: #555;
            line-height: 1.5;
        }
        .info-section h3 {
            color: var(--color-title);
            font-size: 1rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--color-sub);
            padding-bottom: 5px;
        }

        .pass-section { margin-top: 25px; }
        .pass-section input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--color-sub);
            margin-right: 10px;
            outline: none;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
        }
        .pass-section input:focus { border-color: var(--color-title); }
    </style>
</head>
<body>

    <!-- ================= NÚT NHẠC ================= -->
    <button id="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- ================= TRANG 1: TRANG CHỦ ================= -->
    <div id="page1" class="page active">
        <!-- Khung kính trong suốt chứa nội dung -->
        <div class="container">
            <h1 class="title">BÁNH QUY BƠ</h1>
            <h2 class="subtitle">Welcome to Bơ’s little archive</h2>
            
            <button class="btn-main" onclick="goToPage2()">Vào kho bánh 🍪</button>
            
            <div class="social-links">
                <a href="https://www.facebook.com/share/1FJUsbWv1j/?mibextid=wwXIfr" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="https://discord.com/users/1502669716873941283" target="_blank" class="social-btn discord">Discord</a>
                <a href="https://ngl.link/gocnhabo/pop" target="_blank" class="social-btn ngl">NGL</a>
            </div>
        </div>
    </div>

    <!-- ================= TRANG 2: KHO CHARACTER ================= -->
    <div id="page2" class="page">
        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="container page2-container">
            <h1 class="title">HỘP BÁNH QUY CỦA BƠ</h1>
            <p class="small-text">Mỗi chiếc bánh là một câu chuyện Bơ gửi gắm</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm chồng..." onkeyup="searchChar()">
            </div>

            <div class="character-list" id="charList">
                <!-- Danh sách tự động -->
            </div>
        </div>
    </div>

    <!-- ================= MODAL THÔNG TIN TỪNG ANH CHỒNG ================= -->
    <div id="charModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="title" style="margin-top: 0; font-size: 2rem; text-shadow: none;">Tên Nhân Vật</h2>
            
            <div id="modalTags" class="tags"></div>
            
            <div class="info-section">
                <h3>📖 BACKSTORY</h3>
                <p id="modalBackstory">...</p>
            </div>

            <div class="info-section">
                <h3>💬 FIRST MESSAGE</h3>
                <p id="modalFirst">...</p>
            </div>

            <div class="pass-section">
                <input type="password" id="passInput" placeholder="Nhập pass để chat...">
                <button class="btn-main small" style="width: 100%;" onclick="checkPassword()">Mở Khóa Chat</button>
                <p id="passError" style="color: #ff4757; font-weight: bold; display: none; margin-top: 10px;">Sai pass rồi, thử lại nhé 🥺!</p>
            </div>

            <div id="chatLinkSection" style="display: none; margin-top: 25px; text-align: center;">
                <a href="#" id="modalLink" target="_blank" class="btn-main" style="width: 100%;">💖 Vào Chat Ngay 💖</a>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // DATA NHÂN VẬT (Thêm xoá sửa thoải mái ở đây)
        const characters = [
            {
                id: 1,
                name: "Taehyung Tổng Tài",
                tags: ["Lạnh lùng", "Tổng tài", "Ngọt sủng"],
                backstory: "Anh ta là người thừa kế của tập đoàn lớn nhất nước, nhưng lại luôn giấu đi sự ấm áp bên trong cái vỏ bọc lạnh lùng...",
                first: "Cô lại làm đổ cà phê vào áo tôi nữa rồi đấy? Có biết nó đắt thế nào không?",
                pass: "bo123", 
                link: "https://link-chat-cua-ban.com/1"
            },
            {
                id: 2,
                name: "Sói Xám Dịu Dàng",
                tags: ["Dịu dàng", "Thú nhân", "Fantasy"],
                backstory: "Một con sói lang thang trong khu rừng phép thuật, luôn âm thầm bảo vệ bạn.",
                first: "Đừng sợ, tôi sẽ không làm tổn thương em đâu. Lại đây nào.",
                pass: "bocute",
                link: "https://link-chat-cua-ban.com/2"
            }
        ];

        let music = document.getElementById("bg-music");
        let isPlaying = false;

        function toggleMusic() {
            let btn = document.getElementById("music-btn");
            if (isPlaying) {
                music.pause();
                btn.innerText = "🎵 Play Music";
            } else {
                music.play();
                btn.innerText = "⏸️ Pause Music";
            }
            isPlaying = !isPlaying;
        }

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            renderCharacters(characters); 
        }

        function goToPage1() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }

        function renderCharacters(list) {
            const listDiv = document.getElementById('charList');
            listDiv.innerHTML = ""; 
            
            if(list.length === 0) {
                listDiv.innerHTML = "<p style='grid-column: 1 / -1; color: var(--color-title); font-style: italic;'>Không tìm thấy chồng yêu nào cả 🥲</p>";
                return;
            }

            list.forEach(char => {
                let div = document.createElement('div');
                div.className = "char-card";
                div.innerText = char.name;
                div.onclick = () => openModal(char); 
                listDiv.appendChild(div);
            });
        }

        function searchChar() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let filtered = characters.filter(char => 
                char.name.toLowerCase().includes(input) || 
                char.tags.join(" ").toLowerCase().includes(input)
            );
            renderCharacters(filtered);
        }

        let currentChar = null;

        function openModal(char) {
            currentChar = char;
            document.getElementById('charModal').style.display = "flex";
            document.getElementById('modalName').innerText = char.name;
            
            let tagsDiv = document.getElementById('modalTags');
            tagsDiv.innerHTML = "";
            char.tags.forEach(tag => {
                let span = document.createElement('span');
                span.className = "tag";
                span.innerText = "#" + tag;
                tagsDiv.appendChild(span);
            });

            document.getElementById('modalBackstory').innerText = char.backstory;
            document.getElementById('modalFirst').innerText = char.first;
            
            document.getElementById('passInput').value = "";
            document.getElementById('passError').style.display = "none";
            document.getElementById('chatLinkSection').style.display = "none";
        }

        function closeModal() {
            document.getElementById('charModal').style.display = "none";
        }

        window.onclick = function(event) {
            let modal = document.getElementById('charModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function checkPassword() {
            let input = document.getElementById('passInput').value;
            if (input === currentChar.pass) {
                document.getElementById('passError').style.display = "none";
                document.getElementById('chatLinkSection').style.display = "block";
                document.getElementById('modalLink').href = currentChar.link; 
            } else {
                document.getElementById('passError').style.display = "block";
                document.getElementById('chatLinkSection').style.display = "none";
            }
        }
    </script>
</body>
</html>
