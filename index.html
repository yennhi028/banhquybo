<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bơ's Little Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= BẢNG MÀU PASTEL ================= */
        :root {
            --brown-pastel: #BCA38F; 
            --brown-dark: #8B674A;   
            --pink-pastel: #FADCE6;  
            --green-pastel: #DDEBD5; 
            --beige-light: #FDF5EF;  
            --white: #ffffff;
            --text-dark: #5C4332;
            --red-alert: #ff4757;
            --gold: #ffa502;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--beige-light);
            overflow-x: hidden; position: relative; min-height: 100vh;
        }

        /* Quản lý Trang */
        .page {
            display: none; min-height: 100vh; padding: 15px;
            flex-direction: column; align-items: center; justify-content: center;
            width: 100%; position: absolute; top: 0; left: 0;
        }
        .page.active { display: flex; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

        /* Background */
        #page1 {
            background-image: url('https://i.pinimg.com/originals/7e/94/db/7e94db5560ea776c9c34e6e295412c58.gif');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        
        #page2, #page4 {
            background: linear-gradient(135deg, var(--beige-light) 0%, var(--pink-pastel) 50%, var(--green-pastel) 100%);
            background-attachment: fixed;
            justify-content: flex-start; padding-top: 100px; padding-bottom: 50px;
        }

        /* ================= HEADER CỐ ĐỊNH ================= */
        .mini-profile {
            position: fixed; top: 20px; left: 15px;
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.85); padding: 5px 15px 5px 5px;
            border-radius: 30px; z-index: 1000; border: 2px solid var(--white);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }
        .mini-profile img {
            width: 35px; height: 35px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--brown-dark);
        }
        .mini-profile span {
            color: var(--brown-dark); font-weight: 800; font-size: 0.95rem;
        }

        .back-btn { 
            position: fixed; top: 20px; right: 15px; background: rgba(255, 255, 255, 0.9); 
            color: var(--brown-dark); border: 2px solid var(--brown-dark); z-index: 1000;
            font-weight: bold; padding: 8px 15px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .back-btn:hover { background: var(--brown-dark); color: var(--white); }

        /* ================= TRANG 1 ================= */
        .home-container { text-align: center; z-index: 10; width: 95%; max-width: 600px; padding: 20px; margin-top: 30px;}
        .home-title { 
            font-size: min(9vw, 3.2rem); 
            margin: 5px 0 15px 0; white-space: nowrap; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(252, 182, 159, 0.3);
        }
        .subtitle { color: #fcebeb; font-size: min(4.5vw, 1.3rem); margin-bottom: 35px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
        .home-btn-main { 
            background: linear-gradient(135deg, #e3c5a8 0%, #d4a373 100%); color: #ffffff; border: none; padding: 14px 35px; font-size: 1.1rem; 
            border-radius: 30px; cursor: pointer; font-weight: 800; box-shadow: 0 6px 20px rgba(212, 163, 115, 0.4); transition: 0.3s; 
            width: 100%; max-width: 300px; display: inline-block; text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .home-btn-main:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(212, 163, 115, 0.6); }
        .home-btn-main:active { transform: scale(0.95); }

        .social-links { margin-top: 25px; display: flex; justify-content: center; gap: 12px; width: 100%; max-width: 400px; margin-inline: auto;}
        .social-btn { flex: 1; padding: 12px 0; border-radius: 20px; text-decoration: none; text-align: center; font-weight: 800; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.2s; border: 2px solid transparent;}
        .facebook { background: #A3C7D6; color: #2c3e50; } 
        .discord { background: #BCA3C3; color: #2c3e50; } 
        .ngl { background: #FADCE6; color: #2c3e50; } 
        .social-btn:hover { border-color: #fff; transform: translateY(-3px); }

        /* ================= TRANG 2: KHO CHARACTER ================= */
        .archive-container { width: 98%; max-width: 1200px; margin: 0 auto; text-align: center; position: relative;}
        .archive-title { color: var(--brown-dark); font-size: min(7vw, 2.2rem); margin-bottom: 5px; font-weight: 800; text-shadow: 2px 2px 0px var(--white); }
        .archive-desc { color: var(--text-dark); font-style: italic; margin-bottom: 15px; font-size: 1rem; opacity: 0.8;}
        .stat-text { font-size: 0.95rem; color: var(--brown-dark); background: rgba(255,255,255,0.7); display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; }

        /* Gacha Random */
        .random-box {
            background: rgba(255, 255, 255, 0.75); border: 2px dashed var(--brown-pastel);
            border-radius: 20px; padding: 20px; margin: 0 auto 25px auto;
            max-width: 600px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .random-title { font-size: 1.15rem; color: var(--brown-dark); font-weight: 800; margin-bottom: 12px; }
        .random-btn { background-color: var(--brown-dark); color: var(--white); border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(139, 103, 74, 0.3); transition: 0.2s; }
        .random-btn:hover { transform: scale(1.05); background-color: #7a583d; }
        .random-btn:disabled { background-color: var(--brown-pastel); cursor: not-allowed; transform: none; }

        /* Lọc & Tìm kiếm Bảng Điều Khiển */
        .control-panel {
            background: rgba(255,255,255,0.6); padding: 15px; border-radius: 20px; 
            margin-bottom: 25px; border: 1px solid var(--white);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        
        .filter-wrapper { width: 100%; margin: 0 auto 15px auto; }
        .filter-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; justify-content: flex-start; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { background: rgba(255,255,255,0.9); border: 1px solid var(--white); color: var(--text-dark); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; flex-shrink: 0; }
        .filter-btn.active { background: var(--brown-dark); color: var(--white); border-color: var(--brown-dark); }
        .filter-btn.fav-filter { background: #ffeaa7; color: #d63031; border-color: #fdcb6e; }
        .filter-btn.fav-filter.active { background: #d63031; color: #fff; border-color: #d63031; }

        .search-sort-wrapper { display: flex; gap: 10px; width: 100%; flex-direction: column; align-items: center;}
        @media (min-width: 600px) { .search-sort-wrapper { flex-direction: row; } }
        
        .search-box { flex: 2; position: relative; width: 100%;}
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 15px; border: 2px solid var(--white); outline: none; font-size: 1rem; background: rgba(255, 255, 255, 0.9); color: var(--text-dark); font-weight: 600; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); transition: 0.3s; }
        .search-box input:focus { border-color: var(--brown-pastel); }
        
        .sort-box { flex: 1; display: flex; gap: 10px; width: 100%;}
        .sort-box select { width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--white); outline: none; font-size: 0.95rem; background: rgba(255, 255, 255, 0.9); color: var(--brown-dark); font-weight: 700; cursor: pointer; }
        
        .view-toggle { display: flex; gap: 5px; background: rgba(255,255,255,0.9); padding: 5px; border-radius: 15px; border: 2px solid var(--white);}
        .view-btn { border: none; background: transparent; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; opacity: 0.5;}
        .view-btn.active { background: var(--beige-light); opacity: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}

        /* Lưới Thẻ Nhân Vật Mới (Có Ảnh) */
        .character-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; width: 100%; padding-bottom: 30px; 
            transition: 0.3s ease-in-out;
        }

        /* Chế độ List ngang */
        .character-list.list-view {
            grid-template-columns: 1fr;
            max-width: 800px; margin: 0 auto;
        }

        .char-card { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06); 
            border: 2px solid var(--white); 
            display: flex; flex-direction: column; 
            text-align: left; position: relative; transition: 0.3s; cursor: pointer;
            animation: fadeInCard 0.5s ease backwards;
        }
        @keyframes fadeInCard { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .char-card:hover { transform: translateY(-8px); border-color: var(--brown-pastel); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
        
        /* Ảnh Cover trên Card */
        .char-img-wrapper {
            position: relative; width: 100%; height: 220px; overflow: hidden;
            background-color: var(--beige-light);
        }
        .char-img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;
        }
        .char-card:hover .char-img { transform: scale(1.08); }
        
        .img-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        /* Nút Tim */
        .fav-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(255,255,255,0.85); border: none;
            border-radius: 50%; width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; z-index: 10;
        }
        .fav-btn:hover { transform: scale(1.1); background: #fff; }
        .fav-btn.favorited { color: #ff4757; }

        /* Badges */
        .badges-container {
            position: absolute; bottom: 12px; left: 12px;
            display: flex; gap: 6px; z-index: 10;
        }
        .badge {
            padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 800;
            background: rgba(255,255,255,0.9); color: var(--text-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); backdrop-filter: blur(2px);
        }
        .badge.alert { background: var(--red-alert); color: #fff; }
        .badge.new { background: var(--gold); color: #fff; }

        /* Nội dung Card */
        .char-info { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1;}
        
        .char-name { font-size: 1.4rem; color: var(--brown-dark); font-weight: 800; line-height: 1.2;}
        .char-time { font-size: 0.8rem; color: #888; font-weight: 600; font-style: italic;}
        .char-tags-mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .mini-tag { background: var(--beige-light); color: var(--brown-dark); padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--white);}
        
        .char-note-mini { 
            font-size: 0.85rem; color: var(--text-dark); font-weight: 600; font-style: italic; 
            margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            background: rgba(243, 233, 224, 0.5); padding: 8px; border-radius: 10px;
        }
        
        .card-footer { display: flex; justify-content: flex-end; align-items: center; margin-top: auto; padding-top: 10px;}
        .char-action { font-size: 0.9rem; color: var(--white); background: var(--brown-dark); border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .char-card:hover .char-action { background: #7a583d; transform: scale(1.05);}

        /* List View Điều Chỉnh */
        .character-list.list-view .char-card {
            flex-direction: row; height: 180px; align-items: stretch;
        }
        .character-list.list-view .char-img-wrapper { width: 180px; height: 100%; }
        .character-list.list-view .char-info { justify-content: center; }
        @media (max-width: 600px) {
            .character-list.list-view .char-card { flex-direction: column; height: auto; }
            .character-list.list-view .char-img-wrapper { width: 100%; height: 200px; }
        }

        /* ================= TRANG 4: HỒ SƠ CHI TIẾT NHÂN VẬT ================= */
        .profile-container {
            width: 100%; max-width: 800px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.9); border-radius: 30px;
            padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 3px solid var(--white); display: flex; flex-direction: column; align-items: center;
        }

        .profile-img {
            width: 100%; max-width: 350px; 
            border-radius: 20px; border: 5px solid var(--white);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px; object-fit: cover;
        }

        .profile-name {
            color: var(--brown-dark); font-size: 2.2rem; font-weight: 800;
            text-align: center; margin-bottom: 5px; text-shadow: 1px 1px 0px #fff;
        }

        .profile-time {
            font-size: 0.95rem; color: #888; font-weight: 600; font-style: italic;
            margin-bottom: 15px; text-align: center;
        }

        .profile-note {
            color: var(--text-dark); font-weight: 600; font-size: 1rem;
            margin-bottom: 25px; text-align: center; font-style: italic;
            white-space: pre-wrap; 
        }

        /* Khung Cốt Truyện & Thu Gọn */
        .story-box {
            width: 100%; background: var(--beige-light); padding: 25px;
            border-radius: 20px; margin-bottom: 20px; text-align: left;
            border: 1px solid #f2e3d5; box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }
        .story-title {
            color: var(--brown-dark); font-size: 1.1rem; margin-bottom: 15px;
            border-bottom: 2px dashed var(--brown-pastel); padding-bottom: 8px;
            display: inline-block;
        }
        
        .story-content {
            color: var(--text-dark); font-size: 1.05rem; line-height: 1.8;
            white-space: pre-wrap;
        }

        .text-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more-btn {
            background: none; border: none; color: var(--brown-dark);
            font-size: 0.95rem; font-weight: 800; cursor: pointer;
            margin-top: 10px; display: block; width: 100%; text-align: center;
        }
        .read-more-btn:hover { text-decoration: underline; }

        /* Nút Chat Cuối Trang */
        .chat-action-section {
            width: 100%; max-width: 400px; margin: 20px auto 0 auto;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .chat-pass-input {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid var(--brown-pastel);
            outline: none; font-size: 1.1rem; text-align: center; background: #fff;
        }
        .error-text { color: #d63031; font-weight: bold; font-size: 0.95rem; display: none; margin-bottom: -5px;}
        
        .btn-chat {
            background-color: var(--brown-dark); color: var(--white); border: none;
            padding: 16px; font-size: 1.2rem; border-radius: 30px; cursor: pointer;
            font-weight: 800; box-shadow: 0 6px 15px rgba(139, 103, 74, 0.4);
            width: 100%; transition: 0.2s; text-decoration: none; text-align: center;
        }
        .btn-chat:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-chat.disabled { background-color: var(--brown-pastel); cursor: not-allowed; box-shadow: none; transform: none;}

        .copy-btn {
            background: var(--beige-light); border: none; color: var(--brown-dark); 
            padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; 
            cursor: pointer; display: block; margin: 0 auto 20px auto; transition: 0.2s; 
            border: 1px solid var(--brown-pastel);
        }
        .copy-btn:hover { background: var(--brown-pastel); color: var(--white); }

    </style>
</head>
<body>

    <!-- Header Cố Định -->
    <div id="mini-profile" class="mini-profile">
        <img src="https://cdn.discordapp.com/attachments/1547359339063419013/1556743965489766490/IMG_4341.jpg?backend=b2&ex=6ac5464c&is=6ac3f4cc&hm=8266184c7e524097dc8f10d731d3c4158002ae3bee90eee9bd7c06970bfb3206&" alt="Bơ Avatar">
        <span>Bánh Quy Bơ</span>
    </div>

    <!-- ================= TRANG 1 ================= -->
    <div id="page1" class="page active">
        <div class="home-container">
            <h1 class="home-title">𝑩Á𝑵𝑯 𝑸𝑼𝒀 𝑩Ơ</h1>
            <h2 class="subtitle">Welcome to Bơ’s little archive</h2>
            <button class="home-btn-main" onclick="goToPage2()">Vào kho bánh 🍪</button>
            <div class="social-links">
                <a href="https://www.facebook.com/share/1HdUVzoc7j/?mibextid=wwXIfr" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="https://l.facebook.com/l.php?u=https%3A%2F%2Fdiscord.com%2Fusers%2F1502669716873941283%3Ffbclid%3DIwZXh0bgNhZW0CMTEAcGRvZgRzcnRjBmFwcF9pZA80Mzc2MjYzMTY5NzM3ODgAAR5DqtsIrAwoFrM_USRQoKJZ7bkoE9HJSAFRzG5xLm2yJFLma8v0hWpKPSaMmg_aem_GIxkncmG3_I0EIOWeLosfg&h=AUALvjeoRNT8EdH4qePUgz4cBGNvd8w40YMRw6dvqAMg_7EO9SdqU8B17_n-ihfzUpvMS3XdwOCUxE9ckpJu5fRBe2jpCVn_4UhWazx_6d4pTsfVZKddL-FRu7g10QTf6GqlK3INVqVq5xU&s=1" target="_blank" class="social-btn discord">Discord</a>
                <a href="https://ngl.link/gocnhabo/pop" target="_blank" class="social-btn ngl">NGL</a>
            </div>
        </div>
    </div>

    <!-- ================= TRANG 2: DANH SÁCH NHÂN VẬT ================= -->
    <div id="page2" class="page">
        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="archive-container">
            <h1 class="archive-title">HỘP BÁNH QUY CỦA BƠ</h1>
            <p class="archive-desc">Mỗi chiếc bánh là một câu chuyện Bơ gửi gắm</p>
            <div class="stat-text">Kho hiện có: <span id="charCount">0</span> chiếc bánh 🍪</div>
            
            <div class="random-box">
                <div class="random-title">Quay ngẫu nhiên chồng yêu 🌙</div>
                <button id="randomBtn" class="random-btn" onclick="spinRandomChar()">Quay quay nè</button>
            </div>

            <!-- Panel điều khiển Mới -->
            <div class="control-panel">
                <div class="filter-wrapper">
                    <div class="filter-container" id="filterContainer"></div>
                </div>

                <div class="search-sort-wrapper">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm tên, thể loại..." onkeyup="searchChar()">
                    </div>
                    <div class="sort-box">
                        <select id="sortSelect" onchange="searchChar()">
                            <option value="newest">Mới nhất</option>
                            <option value="oldest">Cũ nhất</option>
                            <option value="az">Tên: A - Z</option>
                            <option value="za">Tên: Z - A</option>
                        </select>
                        <div class="view-toggle">
                            <button class="view-btn active" id="btnGrid" onclick="changeView('grid')" title="Lưới">🔲</button>
                            <button class="view-btn" id="btnList" onclick="changeView('list')" title="Danh sách">📄</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="character-list" id="charList"></div>
        </div>
    </div>

    <!-- ================= TRANG 4: HỒ SƠ CHI TIẾT NHÂN VẬT ================= -->
    <div id="page4" class="page">
        <button class="back-btn" onclick="goToPage2()">🔙 Về kho bánh</button>
        
        <div class="profile-container">
            <img id="profileImage" src="" alt="Profile Image" class="profile-img">
            
            <h1 id="profileName" class="profile-name">Tên Nhân Vật</h1>
            <div id="profileTime" class="profile-time"></div>
            
            <div id="profileTags" class="char-tags-mini" style="justify-content: center; margin-bottom: 10px;"></div>
            <div id="profileNote" class="profile-note"></div>

            <button class="copy-btn" id="btnCopyLink" onclick="copyCharLink()">🔗 Copy link chia sẻ</button>

            <div class="story-box">
                <h3 class="story-title">[BACKSTORY]</h3>
                <p id="profileBackstory" class="story-content text-collapsed"></p>
                <button id="btnMoreBackstory" class="read-more-btn" onclick="toggleText('profileBackstory', 'btnMoreBackstory')">Hiển thị toàn bộ ▾</button>
            </div>

            <div class="story-box">
                <h3 class="story-title">[FIRST MESSAGE]</h3>
                <p id="profileFirst" class="story-content text-collapsed"></p>

        /* ------ HỆ THỐNG YÊU THÍCH (LOCAL STORAGE) ------ */
        let favorites = JSON.parse(localStorage.getItem('bo_favorites')) || [];
        function toggleFav(e, id) {
            e.stopPropagation(); // Ngăn click nhầm vào card
            if(favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                e.target.innerText = "🤍";
                e.target.classList.remove('favorited');
            } else {
                favorites.push(id);
                e.target.innerText = "❤️";
                e.target.classList.add('favorited');
            }
            localStorage.setItem('bo_favorites', JSON.stringify(favorites));
            if(currentFilter === "Favs") searchChar(); // Update list nếu đang ở tab Yêu thích
        }

        /* ------ HÀM XỬ LÝ THỜI GIAN ------ */
        function formatTimeAgo(dateString) {
            if (!dateString) return "Mới đăng";
            const postDate = new Date(dateString);
            const now = new Date();
            const diffMs = now - postDate;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 60) return `${diffMins} phút trước`;
            if (diffHours < 24) return `${diffHours} giờ trước`;
            return `${diffDays} ngày trước`;
        }

        function isNew(dateString) {
            if (!dateString) return false;
            const postDate = new Date(dateString);
            const now = new Date();
            return (now - postDate) < (3 * 86400000); // Đánh dấu MỚI nếu đăng trong 3 ngày
        }

        /* ------ CHUYỂN TRANG ------ */
        function hideAllPages() { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); }
        function goToPage1() { hideAllPages(); document.getElementById('page1').classList.add('active'); }
        function goToPage2() { hideAllPages(); document.getElementById('page2').classList.add('active'); renderFilters(); searchChar(); }
        
        /* ------ CHUYỂN ĐỔI GIAO DIỆN LƯỚI/DANH SÁCH ------ */
        function changeView(type) {
            const list = document.getElementById('charList');
            const btnG = document.getElementById('btnGrid');
            const btnL = document.getElementById('btnList');
            if(type === 'grid') {
                list.classList.remove('list-view');
                btnG.classList.add('active'); btnL.classList.remove('active');
            } else {
                list.classList.add('list-view');
                btnL.classList.add('active'); btnG.classList.remove('active');
            }
        }

        /* ------ LỌC & SỐ LƯỢNG TAGS ------ */
        let currentFilter = "All";
        function renderFilters() {
            let allTags = new Set(); let tagCounts = {};
            characters.forEach(c => { c.tags.forEach(t => { allTags.add(t); tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
            
            let filterContainer = document.getElementById('filterContainer');
            filterContainer.innerHTML = `
                <button class="filter-btn active" onclick="filterByTag('All', this)">Tất cả (${characters.length})</button>
                <button class="filter-btn fav-filter" onclick="filterByTag('Favs', this)">❤️ Đã lưu (${favorites.length})</button>
            `;
            
            Array.from(allTags).sort().forEach(tag => {
                let btn = document.createElement('button'); btn.className = "filter-btn"; 
                btn.innerText = `${tag} (${tagCounts[tag]})`; 
                btn.onclick = function() { filterByTag(tag, this); }; filterContainer.appendChild(btn);
            });
        }

        function filterByTag(tag, btn) { 
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); currentFilter = tag; searchChar(); 
        }

        /* ------ QUAY NGẪU NHIÊN ------ */
        function spinRandomChar() {
            if(characters.length === 0) return;
            let btn = document.getElementById('randomBtn'); let originalText = btn.innerText;
            btn.innerText = "Đang quay... ⏳"; btn.disabled = true;
            setTimeout(() => {
                let randomIndex = Math.floor(Math.random() * characters.length);
                openCharPage(characters[randomIndex].id); 
                btn.innerText = originalText; btn.disabled = false;
            }, 800); 
        }

        /* ------ RENDER THẺ CÓ ẢNH ------ */
        function renderCharacters(list) {
            const listDiv = document.getElementById('charList'); listDiv.innerHTML = ""; 
            document.getElementById('charCount').innerText = list.length; 

            if(list.length === 0) { listDiv.innerHTML = "<p style='width: 100%; text-align: center; color: var(--brown-dark); padding: 50px 0; grid-column: 1/-1;'>Không tìm thấy bé nào khớp 🥲</p>"; return; }
            
            list.forEach((char, index) => {
                let div = document.createElement('div'); div.className = "char-card"; 
                div.style.animationDelay = `${index * 0.05}s`; // Hiệu ứng xếp tầng
                
                // Tags mỏng
                let tagsHtml = char.tags.map(t => `<span class="mini-tag">#${t}</span>`).join('');
                
                // Hệ thống Badges (R18, Mới)
                let badgesHtml = '';
                if(isNew(char.postTime)) badgesHtml += `<span class="badge new">✨ Mới</span>`;
                if(char.tags.some(t => t.toUpperCase().includes('R18') || t.toUpperCase().includes('NSFW'))) {
                    badgesHtml += `<span class="badge alert">🔞 R18+</span>`;
                }
                
                let isFav = favorites.includes(char.id);
                let favIcon = isFav ? "❤️" : "🤍";
                let favClass = isFav ? "favorited" : "";

                // HTML cho mỗi thẻ
                div.innerHTML = `
                    <div class="char-img-wrapper">
                        <img class="char-img" src="${char.image || 'https://i.ibb.co/3M3bCYM/boy-placeholder.jpg'}" alt="${char.name}" loading="lazy">
                        <div class="img-overlay"></div>
                        <button class="fav-btn ${favClass}" onclick="toggleFav(event, ${char.id})" title="Yêu thích">${favIcon}</button>
                        ${badgesHtml ? `<div class="badges-container">${badgesHtml}</div>` : ''}
                    </div>
                    <div class="char-info">
                        <div class="char-name">${char.name}</div>
                        <div class="char-time">🕒 Cập nhật: ${formatTimeAgo(char.postTime)}</div>
                        <div class="char-tags-mini">${tagsHtml}</div>
                        ${char.note ? `<div class="char-note-mini">${char.note}</div>` : ''}
                        <div class="card-footer">
                            <button class="char-action">Đọc hồ sơ ➔</button>
                        </div>
                    </div>
                `;
                div.onclick = (e) => { if(!e.target.classList.contains('fav-btn')) openCharPage(char.id); };
                listDiv.appendChild(div);
            });
        }

        function searchChar() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let sortType = document.getElementById('sortSelect').value;
            
            let filtered = characters.filter(char => {
                let matchText = char.name.toLowerCase().includes(input) || char.tags.join(" ").toLowerCase().includes(input);
                
                let matchFilter = true;
                if(currentFilter === "Favs") {
                    matchFilter = favorites.includes(char.id);
                } else if(currentFilter !== "All") {
                    matchFilter = char.tags.includes(currentFilter);
                }
                return matchText && matchFilter;
            });

            // Logic sắp xếp
            filtered.sort((a, b) => {
                if (sortType === 'newest') return new Date(b.postTime) - new Date(a.postTime);
                if (sortType === 'oldest') return new Date(a.postTime) - new Date(b.postTime);
                if (sortType === 'az') return a.name.localeCompare(b.name);
                if (sortType === 'za') return b.name.localeCompare(a.name);
                return 0;
            });

            renderCharacters(filtered);
            
            // Cập nhật lại bộ đếm của nút "Favs" trong filter
            let favBtn = document.querySelector('.filter-btn.fav-filter');
            if(favBtn) favBtn.innerText = `❤️ Đã lưu (${favorites.length})`;
        }

        /* ------ HỆ THỐNG TRANG HỒ SƠ CHI TIẾT (TRANG 4) ------ */
        let currentProfile = null;
        
        function toggleText(contentId, btnId) {
            let content = document.getElementById(contentId);
            let btn = document.getElementById(btnId);
            if (content.classList.contains('text-collapsed')) {
                content.classList.remove('text-collapsed');
                btn.innerText = "Thu gọn bớt ▴";
            } else {
                content.classList.add('text-collapsed');
                btn.innerText = "Hiển thị toàn bộ ▾";
            }
        }

        function openCharPage(id) {
            hideAllPages();
            document.getElementById('page4').classList.add('active');
            
            let char = characters.find(c => c.id === id);
            currentProfile = char;
            
            document.getElementById('profileImage').src = char.image || 'https://i.ibb.co/3M3bCYM/boy-placeholder.jpg';
            document.getElementById('profileImage').style.display = "block";

            document.getElementById('profileName').innerText = char.name;
            
            // Hiển thị ngày giờ đầy đủ
            const pDate = new Date(char.postTime);
            document.getElementById('profileTime').innerText = `🕒 Đăng ngày: ${pDate.getDate()}/${pDate.getMonth()+1}/${pDate.getFullYear()}`;
            
            let tagsHtml = char.tags.map(t => `<span class="mini-tag">#${t}</span>`).join('');
            document.getElementById('profileTags').innerHTML = tagsHtml;
            
            let noteEl = document.getElementById('profileNote');
            if(char.note && char.note.trim() !== "") {
                noteEl.innerText = char.note;
                noteEl.style.display = "block";
            } else { noteEl.style.display = "none"; }
            
            document.getElementById('profileBackstory').innerText = char.backstory;
            document.getElementById('profileFirst').innerText = char.first;

            document.getElementById('profileBackstory').classList.add('text-collapsed');
            document.getElementById('profileFirst').classList.add('text-collapsed');
            document.getElementById('btnMoreBackstory').innerText = "Hiển thị toàn bộ ▾";
            document.getElementById('btnMoreFirst').innerText = "Hiển thị toàn bộ ▾";

            let passInput = document.getElementById('profilePass');
            let passError = document.getElementById('profilePassError');
            let btnChat = document.getElementById('btnChat');
            let noLinkText = document.getElementById('noLinkText');

            btnChat.classList.remove('disabled'); btnChat.style.display = "block";
            passInput.style.display = "none"; passError.style.display = "none";
            noLinkText.style.display = "none";

            if (!char.link || char.link.trim() === "") {
                btnChat.innerText = "💬 Chat với chồng yêu";
                btnChat.classList.add('disabled');
                btnChat.onclick = function(e) { e.preventDefault(); };
                noLinkText.style.display = "block";
            } else {
                if (!char.pass || char.pass.trim() === "") {
                    btnChat.innerText = "💬 Chat với chồng yêu";
                    btnChat.style.backgroundColor = "var(--brown-dark)";
                    btnChat.onclick = function() { window.open(char.link, '_blank'); };
                } else {
                    passInput.style.display = "block"; passInput.value = "";
                    btnChat.innerText = "💬 Mở Khóa Chat";
                    btnChat.style.backgroundColor = "var(--brown-dark)";
                    btnChat.onclick = verifyChat;
                }
            }

            document.getElementById('btnCopyLink').innerText = "🔗 Copy link chia sẻ";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function verifyChat() {
            let input = document.getElementById('profilePass').value;
            if (input === currentProfile.pass) { 
                document.getElementById('profilePassError').style.display = "none"; 
                document.getElementById('profilePass').style.display = "none";
                
                let btn = document.getElementById('btnChat');
                btn.innerText = "💖 Vào Chat Ngay 💖";
                btn.style.backgroundColor = "var(--red-alert)"; 
                btn.onclick = function() { window.open(currentProfile.link, '_blank'); };
                
                window.open(currentProfile.link, '_blank');
            } else { document.getElementById('profilePassError').style.display = "block"; }
        }

        function copyCharLink() {
            if (!currentProfile.link || currentProfile.link.trim() === "") {
                document.getElementById('btnCopyLink').innerText = "❌ Chưa có link để copy!";
                setTimeout(() => { document.getElementById('btnCopyLink').innerText = "🔗 Copy link chia sẻ"; }, 2000);
                return;
            }
            navigator.clipboard.writeText(currentProfile.link).then(() => {
                document.getElementById('btnCopyLink').innerText = "✅ Đã copy link!";
            });
        }
