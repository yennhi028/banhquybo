<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bơ's Little Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CẤU HÌNH GIAO DIỆN (CSS) ================= */
        :root {
            --bg-color: #DDEBD5; /* Màu xanh lá pastel chủ đạo */
            --color-title: #806044; /* Màu chữ BÁNH QUY BƠ */
            --color-sub: #B89476; /* Màu chữ Welcome to... */
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Nút phát nhạc nổi ở cả 2 trang */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        #music-btn:hover {
            transform: scale(1.05);
        }

        /* Khung quản lý trang (Trang 1 / Trang 2) */
        .page {
            display: none;
            min-height: 100vh;
            padding: 50px 20px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .page.active { display: flex; }

        .container {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            width: 100%;
        }

        /* Chữ (Typography) */
        .title {
            color: var(--color-title);
            font-size: 2.5rem;
            margin: 15px 0;
        }

        .subtitle {
            color: var(--color-sub);
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .small-text {
            color: var(--color-title);
            font-style: italic;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* Nút bấm chính */
        .btn-main {
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(128, 96, 68, 0.3);
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            background-color: #6a4f38;
        }

        .btn-main.small {
            padding: 10px 20px;
            font-size: 1rem;
        }

        /* Nút Mạng Xã Hội */
        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .social-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .facebook { background-color: #1877F2; }
        .discord { background-color: #5865F2; }
        .ngl { background-color: #FF4F79; }

        /* Ảnh Gấu trúc */
        .panda-img {
            width: 250px;
            animation: float 3s ease-in-out infinite;
        }

        /* Vật thể trang trí bay lơ lửng */
        .decor {
            position: absolute;
            font-size: 2rem;
            opacity: 0.8;
            animation: float 4s ease-in-out infinite;
            z-index: 0;
            user-select: none;
        }
        .d1 { top: 10%; left: 10%; animation-delay: 0s; }
        .d2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem;}
        .d3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .d4 { bottom: 25%; right: 10%; animation-delay: 0.5s; font-size: 3rem;}
        .d5 { top: 50%; left: 5%; animation-delay: 1.5s; }
        .d6 { top: 40%; right: 5%; animation-delay: 2.5s; font-size: 2.5rem;}
        .d7 { bottom: 5%; right: 25%; animation-delay: 1.2s;}

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* TRANG 2: TÌM KIẾM & DANH SÁCH */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid var(--color-title);
            color: var(--color-title);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            z-index: 100;
        }
        .back-btn:hover { background: var(--color-title); color: white; }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--color-sub);
            outline: none;
            font-size: 1rem;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--color-title);
            font-weight: bold;
        }
        .search-box input::placeholder { color: var(--color-sub); font-weight: normal; }

        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .char-card {
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: var(--color-title);
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px dashed var(--color-sub);
            transition: 0.3s;
        }

        .char-card:hover {
            transform: scale(1.05);
            background: #fdf5ef;
            border-color: var(--color-title);
        }

        /* MODAL (Khung thông tin chi tiết) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 550px;
            padding: 30px;
            border-radius: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid var(--color-title);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--color-sub);
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--color-title); transform: scale(1.2); }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tag {
            background: var(--bg-color);
            color: var(--color-title);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .info-section {
            text-align: left;
            margin-bottom: 20px;
            background: #fdf5ef;
            padding: 15px;
            border-radius: 10px;
            color: #555;
            line-height: 1.5;
        }
        .info-section h3 {
            color: var(--color-title);
            font-size: 1rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--color-sub);
            padding-bottom: 5px;
        }

        .pass-section { margin-top: 25px; }
        .pass-section input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--bg-color);
            margin-right: 10px;
            outline: none;
            font-size: 1rem;
            width: 60%;
        }
        .pass-section input:focus { border-color: var(--color-sub); }
    </style>
</head>
<body>

    <!-- ================= CẤU TRÚC TRANG WEB (HTML) ================= -->
    
    <!-- Nút phát nhạc (Luôn hiện) -->
    <button id="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
    <audio id="bg-music" loop>
        <!-- Điền link nhạc mp3 của bạn vào chữ src="" bên dưới nhé -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- TRANG 1: TRANG CHỦ -->
    <div id="page1" class="page active">
        <!-- Đồ vật trang trí -->
        <div class="decor d1">🌸</div>
        <div class="decor d2">🍪</div>
        <div class="decor d3">🎀</div>
        <div class="decor d4">🥑</div>
        
        <div class="container">
            <!-- Ảnh Gấu trúc cầm bơ (Hãy thay bằng link ảnh của bạn) -->
            <img src="https://i.imgur.com/KxTWeQ9.png" alt="Panda holding cookie and avocado" class="panda-img">
            
            <h1 class="title">✧.* BÁNH QUY BƠ *.✧</h1>
            <h2 class="subtitle">⋆ ˚｡⋆୨୧ Welcome to Bơ’s little archive ୨୧⋆ ˚｡⋆</h2>
            
            <button class="btn-main" onclick="goToPage2()">Vào kho bánh 🍪</button>
            
            <div class="social-links">
                <!-- Dán link Facebook, Discord, NGL của bạn vào dấu # -->
                <a href="#" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="#" target="_blank" class="social-btn discord">Discord</a>
                <a href="#" target="_blank" class="social-btn ngl">NGL</a>
            </div>
        </div>
    </div>

    <!-- TRANG 2: KHO CHARACTER -->
    <div id="page2" class="page">
        <!-- Đồ vật trang trí: bánh quy, hoa, nơ, sao, giấy note, hũ bánh quy -->
        <div class="decor d1">🍪</div>
        <div class="decor d2">🌸</div>
        <div class="decor d3">🎀</div>
        <div class="decor d4">⭐</div>
        <div class="decor d5">📝</div>
        <div class="decor d6">🍯</div>
        <div class="decor d7">🍪</div>

        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="container">
            <h1 class="title">✧ HỘP BÁNH QUY CỦA BƠ ✧</h1>
            <p class="small-text">Mỗi chiếc bánh là một câu chuyện Bơ gửi gắm</p>
            
            <!-- Tìm kiếm -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm chồng..." onkeyup="searchChar()">
            </div>

            <!-- Nơi hiển thị danh sách nhân vật -->
            <div class="character-list" id="charList">
                <!-- Danh sách tự động tạo bằng Code -->
            </div>
        </div>
    </div>

    <!-- KHUNG HIỂN THỊ THÔNG TIN CHARACTER CHI TIẾT (Bấm vào nhân vật sẽ hiện) -->
    <div id="charModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="title" style="margin-top: 0;">Tên Nhân Vật</h2>
            
            <div id="modalTags" class="tags"></div>
            
            <div class="info-section">
                <h3>📖 BACKSTORY</h3>
                <p id="modalBackstory">...</p>
            </div>

            <div class="info-section">
                <h3>💬 FIRST MESSAGE</h3>
                <p id="modalFirst">...</p>
            </div>

            <div class="pass-section">
                <input type="password" id="passInput" placeholder="Nhập pass để chat...">
                <button class="btn-main small" onclick="checkPassword()">Mở Khóa Chat</button>
                <p id="passError" style="color: #ff4757; font-weight: bold; display: none; margin-top: 10px;">Sai pass rồi, thử lại nhé 🥺!</p>
            </div>

            <div id="chatLinkSection" style="display: none; margin-top: 25px; text-align: center;">
                <a href="#" id="modalLink" target="_blank" class="btn-main">💖 Vào Chat Ngay 💖</a>
            </div>
        </div>
    </div>

    <!-- ================= CHỨC NĂNG HOẠT ĐỘNG (JAVASCRIPT) ================= -->
    <script>
        // 1. DATA NHÂN VẬT CỦA BẠN (Thêm, sửa, xóa các anh chồng ở đây)
        const characters = [
            {
                id: 1,
                name: "Taehyung Tổng Tài",
                tags: ["Lạnh lùng", "Tổng tài", "Ngọt sủng"],
                backstory: "Anh ta là người thừa kế của tập đoàn lớn nhất nước, nhưng lại luôn giấu đi sự ấm áp bên trong cái vỏ bọc lạnh lùng...",
                first: "Cô lại làm đổ cà phê vào áo tôi nữa rồi đấy? Có biết nó đắt thế nào không, hả cô thư ký ngốc?",
                pass: "bo123", // Mật khẩu của nhân vật này
                link: "https://link-chat-cua-ban.com/1"
            },
            {
                id: 2,
                name: "Sói Xám Dịu Dàng",
                tags: ["Dịu dàng", "Thú nhân", "Fantasy"],
                backstory: "Một con sói lang thang trong khu rừng phép thuật, luôn âm thầm bảo vệ bạn khỏi những nguy hiểm từ khi bạn còn bé tí.",
                first: "Đừng sợ, tôi sẽ không làm tổn thương em đâu. Lại đây nào, trời sắp mưa rồi.",
                pass: "bocute",
                link: "https://link-chat-cua-ban.com/2"
            },
            {
                id: 3,
                name: "Thanh Mai Trúc Mã",
                tags: ["Học đường", "Hài hước", "Tsundere"],
                backstory: "Cậu bạn hàng xóm cãi nhau với bạn từ hồi cởi truồng tắm mưa, mồm mép độc địa nhưng hễ ai ăn hiếp bạn là lao ra bảo vệ.",
                first: "Này con heo kia, bài tập toán hôm qua mượn vở chép chưa mà mặt cứ nghệt ra thế?",
                pass: "12345",
                link: "https://link-chat-cua-ban.com/3"
            }
            // Mẫu thêm nhân vật mới (Nhớ có dấu phẩy ở trên trước khi dán vào)
        ];

        // 2. CHỨC NĂNG BẬT/TẮT NHẠC
        let music = document.getElementById("bg-music");
        let isPlaying = false;

        function toggleMusic() {
            let btn = document.getElementById("music-btn");
            if (isPlaying) {
                music.pause();
                btn.innerText = "🎵 Play Music";
            } else {
                music.play();
                btn.innerText = "⏸️ Pause Music";
            }
            isPlaying = !isPlaying;
        }

        // 3. CHỨC NĂNG CHUYỂN TRANG
        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            renderCharacters(characters); // In danh sách nhân vật ra khi qua trang 2
        }

        function goToPage1() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }

        // 4. CHỨC NĂNG TẠO DANH SÁCH & TÌM KIẾM
        function renderCharacters(list) {
            const listDiv = document.getElementById('charList');
            listDiv.innerHTML = ""; // Xóa danh sách cũ
            
            if(list.length === 0) {
                listDiv.innerHTML = "<p style='grid-column: 1 / -1; color: var(--color-title); font-style: italic;'>Không tìm thấy chồng yêu nào cả 🥲</p>";
                return;
            }

            list.forEach(char => {
                let div = document.createElement('div');
                div.className = "char-card";
                div.innerText = char.name;
                div.onclick = () => openModal(char); // Bấm vào sẽ mở thẻ chi tiết
                listDiv.appendChild(div);
            });
        }

        function searchChar() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            // Lọc nhân vật theo tên hoặc tag
            let filtered = characters.filter(char => 
                char.name.toLowerCase().includes(input) || 
                char.tags.join(" ").toLowerCase().includes(input)
            );
            renderCharacters(filtered);
        }

        // 5. CHỨC NĂNG BẢNG CHI TIẾT (MODAL) VÀ NHẬP PASS
        let currentChar = null;

        function openModal(char) {
            currentChar = char;
            document.getElementById('charModal').style.display = "flex";
            document.getElementById('modalName').innerText = char.name;
            
            // Xóa tags cũ và thêm tags mới
            let tagsDiv = document.getElementById('modalTags');
            tagsDiv.innerHTML = "";
            char.tags.forEach(tag => {
                let span = document.createElement('span');
                span.className = "tag";
                span.innerText = "#" + tag;
                tagsDiv.appendChild(span);
            });

            // Hiện Backstory và First Message
            document.getElementById('modalBackstory').innerText = char.backstory;
            document.getElementById('modalFirst').innerText = char.first;
            
            // Reset ô nhập mật khẩu
            document.getElementById('passInput').value = "";
            document.getElementById('passError').style.display = "none";
            document.getElementById('chatLinkSection').style.display = "none";
        }

        function closeModal() {
            document.getElementById('charModal').style.display = "none";
        }

        // Đóng khung nếu bấm ra ngoài vùng trắng
        window.onclick = function(event) {
            let modal = document.getElementById('charModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function checkPassword() {
            let input = document.getElementById('passInput').value;
            if (input === currentChar.pass) {
                // Nhập đúng pass
                document.getElementById('passError').style.display = "none";
                document.getElementById('chatLinkSection').style.display = "block";
                document.getElementById('modalLink').href = currentChar.link; // Gắn link chat
            } else {
                // Nhập sai pass
                document.getElementById('passError').style.display = "block";
                document.getElementById('chatLinkSection').style.display = "none";
            }
        }
    </script>
</body>
</html>
