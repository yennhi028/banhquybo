<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bơ's Little Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CẤU HÌNH GIAO DIỆN (CSS) ================= */
        :root {
            --color-title: #9A704F; 
            --color-sub: #C49A75;   
            --btn-bg: #8B674A;      
            --btn-text: #FFF8EF;    
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-image: url('https://i.pinimg.com/originals/7e/94/db/7e94db5560ea776c9c34e6e295412c58.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Nút Gửi Idea nổi ở góc */
        #idea-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        #idea-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* Khung quản lý trang */
        .page {
            display: none;
            min-height: 100vh;
            padding: 15px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .page.active { display: flex; }

        .container {
            text-align: center;
            z-index: 10;
            width: 95%; 
            max-width: 700px;
            background: transparent; 
            padding: 35px 15px; 
            transform: translateY(-5%); 
        }

        .page2-container, .page3-container {
            transform: translateY(0);
            margin-top: 50px; 
            padding: 30px 15px;
        }

        /* Tiêu đề */
        .title {
            color: var(--color-title);
            font-size: min(8.5vw, 2.8rem); 
            margin: 5px 0 10px 0;
            white-space: nowrap; 
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff; 
        }

        .subtitle {
            color: var(--white);
            font-size: min(4.5vw, 1.4rem); 
            margin-bottom: 25px; 
            white-space: nowrap; 
            font-weight: 800;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.6);
        }

        .small-text {
            color: var(--white);
            font-style: italic;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Nút bấm chung */
        .btn-main {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4); 
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-main:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-main.small { padding: 10px 20px; font-size: 1rem; }

        /* Mạng Xã Hội */
        .social-links { margin-top: 25px; display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; width: 100%; }
        .social-btn { flex: 1; padding: 10px 0; border-radius: 20px; text-decoration: none; color: white; font-weight: bold; font-size: min(3.5vw, 0.9rem); white-space: nowrap; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .social-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .facebook { background-color: #1877F2; }
        .discord { background-color: #5865F2; }
        .ngl { background-color: #FF4F79; }

        /* Nút Trở lại */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--color-title);
            color: var(--color-title);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        .back-btn:hover { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }

        /* Khung tìm kiếm & danh sách character */
        .search-box input { width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 25px; border: 2px solid var(--color-sub); outline: none; font-size: 1rem; margin-bottom: 25px; background: rgba(255, 255, 255, 0.95); color: var(--color-title); font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .character-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; width: 100%; }
        .char-card { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.2); color: var(--color-title); font-weight: bold; font-size: 1.2rem; border: 2px dashed var(--color-sub); transition: 0.3s; }
        .char-card:hover { transform: scale(1.05); background: #fdf5ef; border-color: var(--color-title); }

        /* MODAL CHUNG */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid var(--color-title);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: var(--color-sub); transition: 0.2s; }
        .close-btn:hover { color: var(--color-title); transform: scale(1.2); }

        /* =============== TRANG 3: KHU VỰC GÓP IDEA =============== */
        .idea-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .idea-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .idea-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e1e8ed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            color: var(--color-title);
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .time-text {
            color: #999;
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .idea-body {
            color: #444;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        /* Lời nhắn của Bơ (Admin Reply) */
        .admin-reply {
            background: #fdf5ef;
            border-left: 4px solid var(--color-title);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .admin-title {
            color: var(--color-title);
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Form nhập idea */
        .input-group { margin-bottom: 15px; text-align: left;}
        .input-group label { font-weight: bold; color: var(--color-title); display: block; margin-bottom: 5px; }
        .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--color-sub); outline: none; font-family: inherit;}
        .input-group textarea { height: 120px; resize: none; }

        /* Character modal tags */
        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
        .tag { background: var(--color-sub); color: var(--white); padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; }
        .info-section { text-align: left; margin-bottom: 20px; background: #fdf5ef; padding: 15px; border-radius: 10px; color: #555; line-height: 1.5; }
        .info-section h3 { color: var(--color-title); font-size: 1rem; margin-bottom: 8px; border-bottom: 1px dashed var(--color-sub); padding-bottom: 5px; }
        .pass-section { margin-top: 25px; }
        .pass-section input { padding: 12px; border-radius: 10px; border: 2px solid var(--color-sub); margin-right: 10px; outline: none; font-size: 1rem; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Nút Gửi Idea Chuyển Sang Trang 3 -->
    <button id="idea-btn" onclick="goToPage3()">💡 Góp Idea</button>

    <!-- ================= TRANG 1: TRANG CHỦ ================= -->
    <div id="page1" class="page active">
        <div class="container">
            <h1 class="title">𝑩Á𝑵𝑯 𝑸𝑼𝒀 𝑩Ơ</h1>
            <h2 class="subtitle">Welcome to Bơ’s little archive</h2>
            
            <button class="btn-main" onclick="goToPage2()">Vào kho bánh 🍪</button>
            
            <div class="social-links">
                <a href="https://www.facebook.com/share/1FJUsbWv1j/?mibextid=wwXIfr" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="https://discord.com/users/1502669716873941283" target="_blank" class="social-btn discord">Discord</a>
                <a href="https://ngl.link/gocnhabo/pop" target="_blank" class="social-btn ngl">NGL</a>
            </div>
        </div>
    </div>

    <!-- ================= TRANG 2: KHO CHARACTER ================= -->
    <div id="page2" class="page">
        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="container page2-container">
            <h1 class="title" style="font-size: min(8vw, 2.2rem);">HỘP BÁNH QUY CỦA BƠ</h1>
            <p class="small-text">Mỗi chiếc bánh là một câu chuyện Bơ gửi gắm</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm chồng..." onkeyup="searchChar()">
            </div>

            <div class="character-list" id="charList"></div>
        </div>
    </div>

    <!-- ================= TRANG 3: BỨC TƯỜNG Ý TƯỞNG ================= -->
    <div id="page3" class="page">
        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="container page3-container" style="max-width: 600px;">
            <h1 class="title" style="font-size: min(7vw, 2rem);">Babi thả ý tưởng, Bơ thả chữ ❀</h1>
            
            <button class="btn-main" style="margin-top: 10px; margin-bottom: 20px;" onclick="openIdeaModal()">+ Góp hạt cho Bơ</button>
            
            <!-- Danh sách các Idea sẽ xuất hiện ở đây -->
            <div class="idea-feed" id="ideaFeed"></div>
        </div>
    </div>

    <!-- ================= MODAL NHẬP IDEA ================= -->
    <div id="ideaModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeIdeaModal()">&times;</span>
            <h2 class="title" style="margin-top: 0; font-size: 1.8rem; text-shadow: none;">Gửi Hạt Cho Bơ 🌱</h2>
            
            <div class="input-group" style="margin-top: 20px;">
                <label>Thể loại</label>
                <select id="idea-tag">
                    <option value="Bg">Bg (Boy x Girl)</option>
                    <option value="Bl">Bl (Boy x Boy)</option>
                    <option value="Gb">Gb (Girl x Boy)</option>
                    <option value="Gl">Gl (Girl x Girl)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nội dung ý tưởng</label>
                <textarea id="idea-text" placeholder="Gõ ý tưởng của nàng vào đây nhé..."></textarea>
            </div>
            
            <button class="btn-main" style="width: 100%; margin-top: 10px;" onclick="submitIdea()">Gửi Đi Nào ✨</button>
        </div>
    </div>

    <!-- ================= MODAL THÔNG TIN NHÂN VẬT ================= -->
    <div id="charModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="title" style="margin-top: 0; font-size: 2rem; text-shadow: none;">Tên Nhân Vật</h2>
            <div id="modalTags" class="tags"></div>
            <div class="info-section">
                <h3>📖 BACKSTORY</h3>
                <p id="modalBackstory">...</p>
            </div>
            <div class="info-section">
                <h3>💬 FIRST MESSAGE</h3>
                <p id="modalFirst">...</p>
            </div>
            <div class="pass-section">
                <input type="password" id="passInput" placeholder="Nhập pass để chat...">
                <button class="btn-main small" style="width: 100%;" onclick="checkPassword()">Mở Khóa Chat</button>
                <p id="passError" style="color: #ff4757; font-weight: bold; display: none; margin-top: 10px;">Sai pass rồi, thử lại nhé 🥺!</p>
            </div>
            <div id="chatLinkSection" style="display: none; margin-top: 25px; text-align: center;">
                <a href="#" id="modalLink" target="_blank" class="btn-main" style="width: 100%;">💖 Vào Chat Ngay 💖</a>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // DATA NHÂN VẬT 
        const characters = [
            {
                id: 1,
                name: "Taehyung Tổng Tài",
                tags: ["Lạnh lùng", "Tổng tài", "Ngọt sủng"],
                backstory: "Anh ta là người thừa kế của tập đoàn lớn nhất nước, nhưng lại luôn giấu đi sự ấm áp...",
                first: "Cô lại làm đổ cà phê vào áo tôi nữa rồi đấy? Có biết nó đắt thế nào không?",
                pass: "bo123", 
                link: "https://link-chat-cua-ban.com/1"
            }
        ];

        /* ------ HỆ THỐNG CHUYỂN TRANG ------ */
        function goToPage1() { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page1').classList.add('active'); }
        function goToPage2() { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page2').classList.add('active'); renderCharacters(characters); }
        function goToPage3() { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page3').classList.add('active'); loadIdeas(); }

        /* ------ HỆ THỐNG Ý TƯỞNG (IDEA FEED) ------ */
        // Lấy dữ liệu lưu tạm trên máy
        let ideas = JSON.parse(localStorage.getItem('bo_ideas')) || [];

        function loadIdeas() {
            const feed = document.getElementById('ideaFeed');
            feed.innerHTML = "";

            // Trống trơn nếu chưa có ai gửi
            if (ideas.length === 0) {
                feed.innerHTML = "<p style='color: white; text-shadow: 1px 1px 2px #000; font-style: italic; font-size: 1.1rem;'>Chưa có hạt nào được gieo cả, babi mở bát đi! 🌱</p>";
                return;
            }

            // In ra danh sách ý tưởng
            ideas.forEach(idea => {
                let html = `
                <div class="idea-card">
                    <div class="idea-header">
                        <div class="avatar">👤</div>
                        <div class="user-info">
                            <div class="user-name">Ẩn danh 🫧</div>
                            <div class="time-text">Đóng góp ý tưởng • ${idea.time}</div>
                        </div>
                    </div>
                    <div class="idea-body">
                        <strong>[${idea.tag}]</strong> ${idea.text}
                    </div>
                    
                    <!-- Lời nhắn của Bơ (Admin) -->
                    <div class="admin-reply">
                        <div class="admin-title">🥑 Lời nhắn của Bơ:</div>
                        <div style="color: #555;">${idea.adminReply}</div>
                    </div>
                </div>
                `;
                feed.innerHTML += html;
            });
        }

        function openIdeaModal() { document.getElementById('ideaModal').style.display = "flex"; }
        function closeIdeaModal() { document.getElementById('ideaModal').style.display = "none"; }

        function submitIdea() {
            let tag = document.getElementById('idea-tag').value;
            let text = document.getElementById('idea-text').value;
            
            if(!text.trim()) {
                alert("Babi quên nhập ý tưởng rồi kìa!");
                return;
            }

            let newIdea = {
                tag: tag,
                text: text,
                time: "Vừa xong",
                adminReply: "Bơ đã nhận được hạt của nàng rồi nha, Bơ sẽ suy nghĩ thêm nè! 💖" // Mặc định trả lời
            };

            ideas.unshift(newIdea); // Thêm lên đầu danh sách
            localStorage.setItem('bo_ideas', JSON.stringify(ideas)); // Lưu lại vào máy
            
            document.getElementById('idea-text').value = ""; // Xóa trắng ô nhập
            closeIdeaModal();
            loadIdeas(); // Tải lại Bức tường Idea
        }

        /* ------ HỆ THỐNG CHARACTER ------ */
        function renderCharacters(list) {
            const listDiv = document.getElementById('charList');
            listDiv.innerHTML = ""; 
            if(list.length === 0) { listDiv.innerHTML = "<p style='grid-column: 1 / -1; color: var(--white); font-style: italic;'>Không tìm thấy chồng yêu nào cả 🥲</p>"; return; }
            list.forEach(char => {
                let div = document.createElement('div');
                div.className = "char-card";
                div.innerText = char.name;
                div.onclick = () => openModal(char); 
                listDiv.appendChild(div);
            });
        }

        function searchChar() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let filtered = characters.filter(char => char.name.toLowerCase().includes(input) || char.tags.join(" ").toLowerCase().includes(input));
            renderCharacters(filtered);
        }

        let currentChar = null;
        function openModal(char) {
            currentChar = char;
            document.getElementById('charModal').style.display = "flex";
            document.getElementById('modalName').innerText = char.name;
            
            let tagsDiv = document.getElementById('modalTags');
            tagsDiv.innerHTML = "";
            char.tags.forEach(tag => {
                let span = document.createElement('span');
                span.className = "tag";
                span.innerText = "#" + tag;
                tagsDiv.appendChild(span);
            });

            document.getElementById('modalBackstory').innerText = char.backstory;
            document.getElementById('modalFirst').innerText = char.first;
            document.getElementById('passInput').value = "";
            document.getElementById('passError').style.display = "none";
            document.getElementById('chatLinkSection').style.display = "none";
        }
        function closeModal() { document.getElementById('charModal').style.display = "none"; }

        function checkPassword() {
            let input = document.getElementById('passInput').value;
            if (input === currentChar.pass) {
                document.getE
