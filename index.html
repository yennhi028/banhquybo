<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bơ's Little Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CẤU HÌNH GIAO DIỆN ================= */
        :root {
            --bg-color: #DDEBD5; 
            --color-title: #806044; 
            --color-sub: #B89476; 
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            /* Cài đặt GIF làm hình nền chính + Phủ thêm 1 lớp xanh pastel mờ (20%) để dịu mắt */
            background-color: var(--bg-color); 
            background-image: linear-gradient(rgba(221, 235, 213, 0.2), rgba(221, 235, 213, 0.2)), url('https://i.pinimg.com/originals/4c/17/2d/4c172dbbad6d969caf0139f4c742f3b8.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Nút phát nhạc */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        #music-btn:hover { transform: scale(1.05); }

        /* Khung quản lý 2 trang */
        .page {
            display: none;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .page.active { display: flex; }

        /* ---- BỐ CỤC TRANG 1 ---- */
        #page1 {
            justify-content: center; /* Căn giữa màn hình */
        }

        /* Khung kính mờ (Glassmorphism) chứa nội dung trang 1 để nổi bật trên nền GIF */
        .glass-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            /* Nhích toàn bộ khối lên 8% so với tâm màn hình để cân đối hơn */
            transform: translateY(-8vh);
            
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 50px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(128, 96, 68, 0.15);
        }

        /* Chữ BÁNH QUY BƠ */
        .title {
            color: var(--color-title);
            font-size: min(10vw, 3.2rem); 
            margin-bottom: 5px;
            white-space: nowrap; 
            font-weight: 800;
            text-shadow: 2px 2px 5px rgba(255,255,255,0.8);
        }

        /* Chữ Welcome... */
        .subtitle {
            color: var(--color-sub);
            font-size: min(5vw, 1.4rem); 
            margin-bottom: 35px;
            white-space: nowrap; 
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        .small-text {
            color: var(--color-title);
            font-style: italic;
            margin-bottom: 25px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        /* Nút Vào kho bánh */
        .btn-main {
            background-color: var(--color-title);
            color: var(--white);
            border: none;
            padding: 16px 45px;
            font-size: 1.25rem;
            border-radius: 35px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(128, 96, 68, 0.3);
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-main:hover {
            transform: translateY(-4px);
            background-color: #6a4f38;
            box-shadow: 0 8px 20px rgba(128, 96, 68, 0.4);
        }
        .btn-main.small { padding: 12px 25px; font-size: 1.05rem; width: 100%; }

        /* Cụm nút MXH */
        .social-links {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .social-btn:hover { filter: brightness(1.1); transform: translateY(-3px); }
        .facebook { background-color: #1877F2; }
        .discord { background-color: #5865F2; }
        .ngl { background-color: #FF4F79; }

        /* ---- BỐ CỤC TRANG 2 ---- */
        #page2 {
            justify-content: flex-start;
            padding-top: 80px; 
            padding-bottom: 60px;
        }
        
        #page2 .glass-container {
            transform: none; /* Không nhích lên ở trang 2 */
            max-width: 800px;
            padding: 40px 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--color-title);
            color: var(--color-title);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover { background: var(--color-title); color: white; }

        /* Thanh Tìm kiếm */
        .search-box {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .search-box input {
            width: 100%;
            max-width: 450px;
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid var(--color-sub);
            outline: none;
            font-size: 1.05rem;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--color-title);
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .search-box input::placeholder { color: var(--color-sub); font-weight: normal; }

        /* Danh sách thẻ nhân vật */
        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 22px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            color: var(--color-title);
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px dashed var(--color-sub);
            transition: 0.3s;
        }
        .char-card:hover {
            transform: scale(1.05) translateY(-5px);
            background: #fdf5ef;
            border-color: var(--color-title);
            box-shadow: 0 10px 25px rgba(128, 96, 68, 0.2);
        }

        /* ---- MODAL (Khung thông tin chi tiết) ---- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid var(--color-title);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--color-sub);
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--color-title); transform: scale(1.2); }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .tag {
            background: var(--bg-color);
            color: var(--color-title);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .info-section {
            text-align: left;
            margin-bottom: 20px;
            background: #fdf5ef;
            padding: 15px 20px;
            border-radius: 15px;
            color: #555;
            line-height: 1.5;
        }
        .info-section h3 {
            color: var(--color-title);
            font-size: 1.05rem;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--color-sub);
            padding-bottom: 5px;
        }

        .pass-section { margin-top: 30px; }
        .pass-section input {
            padding: 14px;
            border-radius: 12px;
            border: 2px solid var(--bg-color);
            margin-right: 10px;
            outline: none;
            font-size: 1.05rem;
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .pass-section input:focus { border-color: var(--color-title); }
    </style>
</head>
<body>

    <!-- ================= NÚT NHẠC ================= -->
    <button id="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- ================= TRANG 1: TRANG CHỦ ================= -->
    <div id="page1" class="page active">
        <!-- Đưa các thành phần vào một khung kính mờ để hiển thị đẹp nhất trên nền GIF -->
        <div class="glass-container">
            <h1 class="title">BÁNH QUY BƠ</h1>
            <h2 class="subtitle">Welcome to Bơ’s little archive</h2>
            
            <button class="btn-main" onclick="goToPage2()">Vào kho bánh 🍪</button>
            
            <div class="social-links">
                <a href="https://www.facebook.com/share/1FJUsbWv1j/?mibextid=wwXIfr" target="_blank" class="social-btn facebook">Facebook</a>
                <a href="https://discord.com/users/1502669716873941283" target="_blank" class="social-btn discord">Discord</a>
                <a href="https://ngl.link/gocnhabo/pop" target="_blank" class="social-btn ngl">NGL</a>
            </div>
        </div>
    </div>

    <!-- ================= TRANG 2: KHO CHARACTER ================= -->
    <div id="page2" class="page">
        <button class="back-btn" onclick="goToPage1()">🔙 Trở lại</button>

        <div class="glass-container">
            <h1 class="title">HỘP BÁNH QUY CỦA BƠ</h1>
            <p class="small-text">Mỗi chiếc bánh là một câu chuyện Bơ gửi gắm</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm chồng..." onkeyup="searchChar()">
            </div>

            <div class="character-list" id="charList">
                <!-- Danh sách nhân vật sẽ tự động đổ vào đây -->
            </div>
        </div>
    </div>

    <!-- ================= MODAL HIỂN THỊ THÔNG TIN ================= -->
    <div id="charModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalName" class="title" style="margin-top: 0; font-size: 2rem; text-align: center;">Tên Nhân Vật</h2>
            
            <div id="modalTags" class="tags"></div>
            
            <div class="info-section">
                <h3>📖 BACKSTORY</h3>
                <p id="modalBackstory">...</p>
            </div>

            <div class="info-section">
                <h3>💬 FIRST MESSAGE</h3>
                <p id="modalFirst">...</p>
            </div>

            <div class="pass-section">
                <input type="password" id="passInput" placeholder="Nhập pass để mở link chat...">
                <button class="btn-main small" onclick="checkPassword()">Mở Khóa Chat</button>
                <p id="passError" style="color: #ff4757; font-weight: bold; display: none; margin-top: 10px; text-align: center;">Sai pass rồi, thử lại nhé 🥺!</p>
            </div>

            <div id="chatLinkSection" style="display: none; margin-top: 25px; text-align: center;">
                <a href="#" id="modalLink" target="_blank" class="btn-main" style="width: 100%;">💖 Vào Chat Ngay 💖</a>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // BẠN SỬA DANH SÁCH NHÂN VẬT Ở DƯỚI ĐÂY
        const characters = [
            {
                id: 1,
                name: "Taehyung Tổng Tài",
                tags: ["Lạnh lùng", "Tổng tài", "Ngọt sủng"],
                backstory: "Anh ta là người thừa kế của tập đoàn lớn nhất nước, nhưng lại luôn giấu đi sự ấm áp bên trong cái vỏ bọc lạnh lùng...",
                first: "Cô lại làm đổ cà phê vào áo tôi nữa rồi đấy? Có biết nó đắt thế nào không?",
                pass: "bo123", 
                link: "https://link-chat-cua-ban.com/1"
            },
            {
                id: 2,
                name: "Sói Xám Dịu Dàng",
                tags: ["Dịu dàng", "Thú nhân", "Fantasy"],
                backstory: "Một con sói lang thang trong khu rừng phép thuật, luôn âm thầm bảo vệ bạn.",
                first: "Đừng sợ, tôi sẽ không làm tổn thương em đâu. Lại đây nào.",
                pass: "bocute",
                link: "https://link-chat-cua-ban.com/2"
            }
        ];

        let music = document.getElementById("bg-music");
        let isPlaying = false;

        function toggleMusic() {
            let btn = document.getElementById("music-btn");
            if (isPlaying) {
                music.pause();
                btn.innerText = "🎵 Play Music";
            } else {
                music.play();
                btn.innerText = "⏸️ Pause Music";
            }
            isPlaying = !isPlaying;
        }

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            renderCharacters(characters); 
        }

        function goToPage1() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }

        function renderCharacters(list) {
            const listDiv = document.getElementById('charList');
            listDiv.innerHTML = ""; 
            
            if(list.length === 0) {
                listDiv.innerHTML = "<p style='grid-column: 1 / -1; color: var(--color-title); font-style: italic; text-align: center;'>Không tìm thấy chồng yêu nào cả 🥲</p>";
                return;
            }

            list.forEach(char => {
                let div = document.createElement('div');
                div.className = "char-card";
                div.innerText = char.name;
                div.onclick = () => openModal(char); 
                listDiv.appendChild(div);
            });
        }

        function searchChar() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let filtered = characters.filter(char => 
                char.name.toLowerCase().includes(input) || 
                char.tags.join(" ").toLowerCase().includes(input)
            );
            renderCharacters(filtered);
        }

        let currentChar = null;

        function openModal(char) {
            currentChar = char;
            document.getElementById('charModal').style.display = "flex";
            document.getElementById('modalName').innerText = char.name;
            
            let tagsDiv = document.getElementById('modalTags');
            tagsDiv.innerHTML = "";
            char.tags.forEach(tag => {
                let span = document.createElement('span');
                span.className = "tag";
                span.innerText = "#" + tag;
                tagsDiv.appendChild(span);
            });

            document.getElementById('modalBackstory').innerText = char.backstory;
            document.getElementById('modalFirst').innerText = char.first;
            
            document.getElementById('passInput').value = "";
            document.getElementById('passError').style.display = "none";
            document.getElementById('chatLinkSection').style.display = "none";
        }

        function closeModal() {
            document.getElementById('charModal').style.display = "none";
        }

        window.onclick = function(event) {
            let modal = document.getElementById('charModal');
            if (event.target == modal) {
